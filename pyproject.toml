[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneqmultia"
version = "0.3.0"
description = "OneQMultiA — aggregate answers from multiple AI chat platforms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "playwright>=1.41.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "xhtml2pdf>=0.2.15",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]
ui = ["streamlit>=1.31.0"]
packaging = [
    "pyinstaller>=6.3.0",
    "pillow>=10.0.0",
]

[project.scripts]
oneqmultia = "oneqmultia.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oneqmultia = ["config/default_platforms.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]
pythonpath = ["src"]
