# 预置平台 — selectors 校准说明：
# 1) 用 Chrome 打开目标站 → F12 → 在 Elements 中选中输入框/发送键/最后一条助手消息，复制 selector。
# 2) 在已登录浏览器中验证：Playwright 连接 CDP 后可在 /docs 调健康检查或实际 ask。
# 3) 站点改版后通过 PATCH /api/platforms/{id} 更新 selectors，无需改代码。
# 4) 若库中已有数据，default_platforms.yaml 不会覆盖 DB；需运行 python -m oneqmultia.tools.reset_db 或删库后重启以重新 seed。
# interaction.input_method: keyboard(推荐，触发React合成事件) | fill | type
# interaction.send_method:  enter(推荐，跨站通用) | click
# interaction.wait_strategy: polling
# timeout_seconds：等回答生成的上限（按历史成功耗时 + 余量）。找输入框另有短超时，避免选不到框时空等满档。
platforms:
  - id: chatgpt
    display_name: ChatGPT
    url: https://chatgpt.com/
    icon: chatgpt.svg
    group: international
    enabled: true
    sort_order: 1
    timeout_seconds: 180
    adapter_type: specialized
    adapter_module: "oneqmultia.platforms.specialized.chatgpt:ChatGPTAdapter"
    selectors:
      # ChatGPT ProseMirror 编辑区（contenteditable div）
      # 备用：新版可能改为 #prompt-textarea（无 div 前缀）或 textarea
      # 优先可见的 composer；隐藏的 #prompt-textarea 副本由 generic 跳过
      input_box: "#prompt-textarea, [data-testid='prompt-textarea'], div.ProseMirror[contenteditable='true'], div[contenteditable='true'][role='textbox']"
      send_button: 'button[data-testid="send-button"], button[aria-label*="Send"], button[aria-label*="发送"]'
      # 新版 ChatGPT 回复在 [data-message-author-role="assistant"] 下的 .markdown/.prose
      response_container: '[data-message-author-role="assistant"] .markdown, [data-message-author-role="assistant"] .prose, [data-message-author-role="assistant"]'
      response_complete: ""
      new_chat_button: ""
    interaction:
      input_method: keyboard
      send_method: click
      wait_strategy: polling

  - id: gemini
    display_name: Gemini
    url: https://gemini.google.com/app
    icon: gemini.svg
    group: international
    enabled: true
    sort_order: 2
    timeout_seconds: 210
    adapter_type: generic
    adapter_module: ""
    selectors:
      # Quill 编辑器；部分版本在 rich-textarea 的 shadow root 内
      input_box: ".ql-editor[contenteditable='true'], rich-textarea .ql-editor, rich-textarea >>> [contenteditable='true'], [aria-label*='Enter a prompt'], [aria-label*='向 Gemini'], [aria-label*='提示'], div[contenteditable='true'][role='textbox']"
      send_button: "button[aria-label*='Send'], button[aria-label*='发送'], button.send-button, button[jsname*='send']"
      response_container: "model-response, message-content, .model-response-text, model-response .markdown, message-content .markdown"
      response_complete: ""
      new_chat_button: ""
    interaction:
      input_method: keyboard
      send_method: click
      wait_strategy: polling

